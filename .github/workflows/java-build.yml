name: Java build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/isp/*.java

      - name: Smoke test (login, then exit)
        run: |
          printf 'admin\nadmin123\n0\n' | java -cp out isp.Main --plain | tee run.log
          grep -q "Data saved" run.log
